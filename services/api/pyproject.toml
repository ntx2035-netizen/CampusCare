[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campuscare-api"
version = "1.0.0"
description = "API điều phối sự cố CampusCare"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "email-validator==2.2.0",
  "fastapi==0.141.1",
  "minio==7.2.16",
  "pillow==12.3.0",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "pwdlib[argon2]==0.2.1",
  "pyjwt==2.13.0",
  "python-multipart==0.0.32",
  "qrcode==8.2",
  "redis==6.4.0",
  "sqlalchemy==2.0.43",
  "starlette==1.6.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.12.0",
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
